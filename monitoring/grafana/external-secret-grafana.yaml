apiVersion: external-secrets.io/v1alpha1
kind: ExternalSecret
metadata:
  name: grafana
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: grafana-auth-secret
    template:
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_USER: "admin"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .grafana_password }}" # Esse valor vai ser substituído pelo valor do SecretStore
  data:
    - secretKey: grafana_password
      remoteRef:
        key: grafana-admin-password
        version: latest